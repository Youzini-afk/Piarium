[workspace]
members = ["crates/piarium-kernel"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22.1"
hex = "0.4.3"
fs2 = "0.4.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "0.10.8"
thiserror = "2.0.11"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
