version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # The artifact actions must carry matching major versions, and the download action's v8 is the
      # counterpart to the newer non-zipped upload behavior. Proposing one side alone is half a
      # migration, so keep the pair in one pull request.
      artifact-actions:
        patterns:
          - actions/upload-artifact
          - actions/download-artifact

  # This workspace installs with Bun and CI runs `bun install --frozen-lockfile`. The `npm`
  # ecosystem edits `package.json` without maintaining `bun.lock`, so every pull request it opened
  # failed at install before a single real check ran. The `bun` ecosystem understands the text-based
  # `bun.lock` and updates both.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # ESLint and its TypeScript plugins have to move together: a major on one is inconsistent with
      # the others, so separate pull requests cannot pass individually.
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - eslint-plugin-*
          - typescript-eslint
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      # Pi publishes its packages in lockstep and Piarium pins them to one exact version, so a
      # single-package bump is a half upgrade that cannot pass. Upgrading also means refreshing the
      # cloud runtime lockfile and the isolated VS Code runtime lockfile, so keep it one review.
      pi-runtime:
        patterns:
          - '@earendil-works/*'
