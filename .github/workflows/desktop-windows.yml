name: Windows Desktop Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package and smoke Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows x64 installer
        run: bun run electron:build:win

      - name: Smoke unpacked Windows application
        run: bun run electron:smoke:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: piarium-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest.yml
