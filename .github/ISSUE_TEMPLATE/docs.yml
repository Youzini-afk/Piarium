name: 文档
description: 文档页有误、缺失，或还在用旧品牌
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: 页面
      description: packages/docs/content/docs/ 下的路径，或侧边栏标题
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 哪里不对
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: 建议改法
