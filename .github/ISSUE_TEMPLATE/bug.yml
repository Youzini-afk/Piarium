name: 缺陷报告
description: 功能坏了，或行为和预期不符
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告。请先搜索已有 Issue。不要包含密钥、提示词正文或私人文件内容。
  - type: textarea
    id: what-happened
    attributes:
      label: 实际发生了什么
      description: 你看到了什么？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你期望发生什么
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 产品端
      options:
        - Web
        - 桌面端
        - VS Code
        - 移动端
        - CLI / Docker
        - 不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 0.1.0 或 git SHA
  - type: textarea
    id: environment
    attributes:
      label: 环境
      placeholder: 操作系统、Node/Bun 版本、安装方式
