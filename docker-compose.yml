services:
  piarium:
    image: ${PIARIUM_IMAGE:-ghcr.io/youzini-afk/piarium:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build Dockerfile.base as piarium-runtime-base:local and override this
        # variable when a completely local image chain is preferred.
        RUNTIME_BASE_IMAGE: ${PIARIUM_RUNTIME_BASE_IMAGE:-ghcr.io/youzini-afk/piarium-runtime-base:main}
    container_name: piarium
    init: true
    user: "1000:1000"
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/piarium:/home/piarium/.config/piarium
      - ./data/ssh:/home/piarium/.ssh
      - ./data/cloudflared:/home/piarium/.cloudflared
      - ./workspaces:/home/piarium/workspaces
    environment:
      HOME: /home/piarium
      PIARIUM_DATA_DIR: /home/piarium/.config/piarium
      PIARIUM_WORKSPACE_ROOT: /home/piarium/workspaces
      PIARIUM_HOST: ${PIARIUM_HOST:-0.0.0.0}
      # Port publishing makes UI authentication mandatory. Generate a value,
      # for example: PIARIUM_UI_PASSWORD="$(openssl rand -base64 24)" docker compose up -d
      PIARIUM_UI_PASSWORD: ${PIARIUM_UI_PASSWORD:?Set PIARIUM_UI_PASSWORD before exposing Piarium through Docker}
      # Tunnel values stay runtime-only and are never Docker build arguments.
      PIARIUM_TUNNEL_PROVIDER: ${PIARIUM_TUNNEL_PROVIDER:-}
      PIARIUM_TUNNEL_MODE: ${PIARIUM_TUNNEL_MODE:-}
      PIARIUM_TUNNEL_HOSTNAME: ${PIARIUM_TUNNEL_HOSTNAME:-}
      PIARIUM_TUNNEL_TOKEN: ${PIARIUM_TUNNEL_TOKEN:-}
      PIARIUM_TUNNEL_CONFIG: ${PIARIUM_TUNNEL_CONFIG:-/home/piarium/.cloudflared/config.yml}
    restart: unless-stopped
