services:
  piarium:
    # Use the prebuilt image for faster startup:
    # image: ghcr.io/youzini-afk/piarium:latest
    # Or keep the local build path below for development/custom images.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build Dockerfile.base locally first and change this to
        # openchamber-runtime-base:local for fully local app image builds.
        RUNTIME_BASE_IMAGE: ghcr.io/youzini-afk/openchamber-runtime-base:main
    container_name: openchamber
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/piarium:/home/openchamber/.config/openchamber
      - ./data/opencode/share:/home/openchamber/.local/share/opencode
      - ./data/opencode/state:/home/openchamber/.local/state/opencode
      - ./data/opencode/config:/home/openchamber/.config/opencode
      - ./data/ssh:/home/openchamber/.ssh
      - ./workspaces:/home/openchamber/workspaces
    environment:
      PIARIUM_WORKSPACE_ROOT: /home/openchamber/workspaces
      # Docker binds OpenChamber to 0.0.0.0 for port mapping, so UI auth is required.
      # Set this before starting, for example:
      #   PIARIUM_UI_PASSWORD="$(openssl rand -base64 24)" docker compose up -d
      PIARIUM_UI_PASSWORD: ${PIARIUM_UI_PASSWORD:?Set PIARIUM_UI_PASSWORD before exposing OpenChamber through Docker}
    # PIARIUM_HOST: 0.0.0.0  # Bind address (default in Docker entrypoint: 0.0.0.0)
    # PIARIUM_TUNNEL_PROVIDER: cloudflare
    # PIARIUM_TUNNEL_MODE: quick  # quick | managed-remote | managed-local
    # PIARIUM_TUNNEL_HOSTNAME: app.example.com  # required for managed-remote
    # PIARIUM_TUNNEL_TOKEN: your_cloudflare_token  # required for managed-remote
    # PIARIUM_TUNNEL_CONFIG: /home/openchamber/.cloudflared/config.yml  # optional for managed-local
    # OH_MY_OPENCODE: true # enable oh-my-opencode
    # OPENCODE_HOST: http://172.17.0.1:4096 # Connect to external OpenCode server
    # OPENCODE_SKIP_START: true # skip start opencode
    # PIARIUM_OPENCODE_HOSTNAME: 0.0.0.0 # Bind OpenCode to all interfaces
    restart: unless-stopped
