<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16" />
    <link rel="mask-icon" href="/favicon.svg" color="#edb449" />

    <!-- Apple touch icon - PNG format required for iOS PWA support -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />

    <!-- Web app manifest (endpoint-first with data URL fallback) -->
    <script>
      const baseUrl = location.origin;
      const defaultAppName = 'Piarium - Pi Coding Workspace';
      const defaultShortName = 'Piarium';
      const pwaNameStorageKey = 'piarium.pwaName';
      const pwaOrientationStorageKey = 'piarium.pwaOrientation';
      const mobileKeyboardModeStorageKey = 'piarium.mobileKeyboardMode';
      const pwaRecentSessionsStorageKey = 'piarium.pwaRecentSessions';
      const viewportBaseContent = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';

      const normalizePwaName = (value, fallback) => {
        if (typeof value !== 'string') {
          return fallback;
        }
        const normalized = value.trim().replace(/\s+/g, ' ');
        if (!normalized) {
          return fallback;
        }
        return normalized.slice(0, 64);
      };

      const truncate = (value, maxLength) => {
        if (typeof value !== 'string') {
          return '';
        }
        return value.length > maxLength ? value.slice(0, maxLength) : value;
      };

      const normalizePwaOrientation = (value, fallback = 'system') => {
        if (value === 'portrait' || value === 'landscape' || value === 'system') {
          return value;
        }
        return fallback;
      };

      const normalizeMobileKeyboardMode = (value, fallback = 'resize-content') => {
        if (value === 'native' || value === 'resize-content') {
          return value;
        }
        return fallback;
      };

      const getViewportContentForMobileKeyboardMode = (value) => {
        const mode = normalizeMobileKeyboardMode(value, 'resize-content');
        return mode === 'resize-content'
          ? `${viewportBaseContent}, interactive-widget=resizes-content`
          : viewportBaseContent;
      };

      const applyStoredMobileKeyboardMode = () => {
        let mode = 'resize-content';
        try {
          mode = normalizeMobileKeyboardMode(localStorage.getItem(mobileKeyboardModeStorageKey), 'resize-content');
          if (mode === 'resize-content') {
            localStorage.removeItem(mobileKeyboardModeStorageKey);
          }
        } catch {
          mode = 'resize-content';
        }

        document.documentElement.setAttribute('data-oc-mobile-keyboard-mode', mode);
        const viewportMeta = document.querySelector('meta[name="viewport"]');
        if (viewportMeta) {
          viewportMeta.setAttribute('content', getViewportContentForMobileKeyboardMode(mode));
        }
      };

      applyStoredMobileKeyboardMode();

      const getStoredInstallName = () => {
        try {
          const storedName = localStorage.getItem(pwaNameStorageKey);
          return normalizePwaName(storedName, defaultAppName);
        } catch {
          return defaultAppName;
        }
      };

      const setStoredInstallName = (value) => {
        const normalizedName = normalizePwaName(value, '');
        try {
          if (normalizedName) {
            localStorage.setItem(pwaNameStorageKey, normalizedName);
          } else {
            localStorage.removeItem(pwaNameStorageKey);
          }
        } catch {
          return defaultAppName;
        }
        return normalizedName || defaultAppName;
      };

      const getStoredOrientation = () => {
        try {
          const storedOrientation = localStorage.getItem(pwaOrientationStorageKey);
          return normalizePwaOrientation(storedOrientation, 'system');
        } catch {
          return 'system';
        }
      };

      const setStoredOrientation = (value) => {
        const normalizedOrientation = normalizePwaOrientation(value, 'system');
        try {
          localStorage.setItem(pwaOrientationStorageKey, normalizedOrientation);
        } catch {
          return 'system';
        }
        return normalizedOrientation;
      };

      const getQueryInstallNameOverride = () => {
        try {
          const params = new URLSearchParams(location.search);
          const queryName = params.get('pwa_name') ?? params.get('app_name') ?? params.get('appName');
          if (queryName === null) {
            return null;
          }

          const normalizedQueryName = normalizePwaName(queryName, '');
          if (normalizedQueryName) {
            localStorage.setItem(pwaNameStorageKey, normalizedQueryName);
            return normalizedQueryName;
          }

          localStorage.removeItem(pwaNameStorageKey);
          return defaultAppName;
        } catch {
          return null;
        }
      };

      const parseRecentSessionShortcuts = () => {
        try {
          const raw = localStorage.getItem(pwaRecentSessionsStorageKey);
          if (!raw) {
            return [];
          }

          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) {
            return [];
          }

          const seen = new Set();
          const recentSessions = [];

          for (const item of parsed) {
            if (!item || typeof item !== 'object') {
              continue;
            }

            const sessionId = typeof item.sessionId === 'string' ? item.sessionId.trim().slice(0, 160) : '';
            if (!sessionId || seen.has(sessionId)) {
              continue;
            }

            const fallbackTitle = `Session ${recentSessions.length + 1}`;
            const title = truncate(normalizePwaName(item.title, fallbackTitle), 48);

            seen.add(sessionId);
            recentSessions.push({ sessionId, title });

            if (recentSessions.length >= 3) {
              break;
            }
          }

          return recentSessions;
        } catch {
          return [];
        }
      };

      const buildShortcuts = (recentSessions) => {
        const shortcuts = [
          {
            name: 'Appearance Settings',
            short_name: 'Settings',
            description: 'Open appearance settings',
            url: `${baseUrl}/?settings=appearance`,
            icons: [{ src: `${baseUrl}/pwa-192.png`, sizes: '192x192', type: 'image/png' }],
          },
        ];

        for (const session of recentSessions) {
          const sessionTitle = truncate(session.title, 32);
          shortcuts.push({
            name: sessionTitle,
            short_name: sessionTitle,
            description: 'Open recent session',
            url: `${baseUrl}/?session=${encodeURIComponent(session.sessionId)}`,
            icons: [{ src: `${baseUrl}/pwa-192.png`, sizes: '192x192', type: 'image/png' }],
          });
        }

        return shortcuts;
      };

      const buildManifest = (appName, recentSessions, orientationPreference) => {
        const shortName = appName === defaultAppName ? defaultShortName : truncate(appName, 30);
        const manifestOrientation = orientationPreference === 'portrait'
          ? 'portrait-primary'
          : orientationPreference === 'landscape'
            ? 'landscape-primary'
            : null;
        return {
          name: appName,
          short_name: shortName,
          description: 'Pi-native coding workspace for desktop and web',
          id: `${baseUrl}/`,
          start_url: `${baseUrl}/`,
          scope: `${baseUrl}/`,
          display: 'standalone',
          display_override: ['window-controls-overlay'],
          ...(manifestOrientation ? { orientation: manifestOrientation } : {}),
          background_color: '#151313',
          theme_color: '#edb449',
          icons: [
            { src: `${baseUrl}/pwa-192.png`, sizes: '192x192', type: 'image/png', purpose: 'any' },
            { src: `${baseUrl}/pwa-512.png`, sizes: '512x512', type: 'image/png', purpose: 'any' },
            { src: `${baseUrl}/pwa-maskable-192.png`, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
            { src: `${baseUrl}/pwa-maskable-512.png`, sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
            { src: `${baseUrl}/apple-touch-icon-180x180.png`, sizes: '180x180', type: 'image/png', purpose: 'any' },
            { src: `${baseUrl}/apple-touch-icon-152x152.png`, sizes: '152x152', type: 'image/png', purpose: 'any' },
            { src: `${baseUrl}/favicon-32.png`, sizes: '32x32', type: 'image/png' },
            { src: `${baseUrl}/favicon-16.png`, sizes: '16x16', type: 'image/png' },
          ],
          shortcuts: buildShortcuts(recentSessions),
          categories: ['developer', 'tools', 'productivity'],
          lang: 'en',
        };
      };

      const buildManifestEndpointUrl = (installNameOverride = null, orientationOverride = null) => {
        const params = new URLSearchParams();
        if (typeof installNameOverride === 'string') {
          params.set('appName', installNameOverride);
        }
        if (typeof orientationOverride === 'string') {
          params.set('orientation', normalizePwaOrientation(orientationOverride, 'system'));
        }
        const search = params.toString();
        return `${baseUrl}/manifest.webmanifest${search ? `?${search}` : ''}`;
      };

      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      // Required so the browser sends auth cookies when fetching the manifest,
      // enabling PWA installation behind authentication proxies (e.g. Cloudflare Access).
      manifestLink.crossOrigin = 'use-credentials';
      document.head.appendChild(manifestLink);

      let activeManifestBlobUrl = null;
      let manifestRequestVersion = 0;

      const setManifestFromBlob = (manifest) => {
        if (activeManifestBlobUrl) {
          URL.revokeObjectURL(activeManifestBlobUrl);
        }

        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        activeManifestBlobUrl = URL.createObjectURL(manifestBlob);
        manifestLink.href = activeManifestBlobUrl;
      };

      const setManifestFromEndpoint = (manifestUrl) => {
        if (activeManifestBlobUrl) {
          URL.revokeObjectURL(activeManifestBlobUrl);
          activeManifestBlobUrl = null;
        }
        manifestLink.href = manifestUrl;
      };

      const canUseManifestEndpoint = async (manifestUrl, requestVersion) => {
        if (typeof fetch !== 'function') {
          return false;
        }

        const controller = typeof AbortController === 'function' ? new AbortController() : null;
        const timeoutId = setTimeout(() => {
          controller?.abort();
        }, 1500);

        try {
          const response = await fetch(manifestUrl, {
            credentials: 'include',
            cache: 'no-store',
            headers: {
              Accept: 'application/manifest+json, application/json;q=0.9, */*;q=0.1',
            },
            ...(controller ? { signal: controller.signal } : {}),
          });

          if (requestVersion !== manifestRequestVersion || !response.ok) {
            return false;
          }

          const contentType = response.headers.get('content-type') || '';
          return /manifest|json/i.test(contentType);
        } catch {
          return false;
        } finally {
          clearTimeout(timeoutId);
        }
      };

      const updateManifest = async (installNameOverride = null, orientationOverride = null) => {
        const resolvedFallbackName = typeof installNameOverride === 'string' ? installNameOverride : getStoredInstallName();
        const resolvedOrientation = typeof orientationOverride === 'string'
          ? normalizePwaOrientation(orientationOverride, 'system')
          : getStoredOrientation();
        const recentSessions = parseRecentSessionShortcuts();
        const manifest = buildManifest(resolvedFallbackName, recentSessions, resolvedOrientation);
        const manifestUrl = buildManifestEndpointUrl(installNameOverride, resolvedOrientation);
        const requestVersion = ++manifestRequestVersion;

        const useEndpoint = await canUseManifestEndpoint(manifestUrl, requestVersion);
        if (requestVersion !== manifestRequestVersion) {
          return;
        }

        if (useEndpoint) {
          setManifestFromEndpoint(manifestUrl);
          return;
        }

        setManifestFromBlob(manifest);
      };

      const refreshManifestFromStorage = () => {
        void updateManifest();
      };

      const initialInstallNameOverride = getQueryInstallNameOverride();
      void updateManifest(initialInstallNameOverride);

      window.__PIARIUM_GET_PWA_INSTALL_NAME__ = () => getStoredInstallName();
      window.__PIARIUM_SET_PWA_INSTALL_NAME__ = (value) => {
        const resolvedName = setStoredInstallName(value);
        void updateManifest(resolvedName);
        return resolvedName;
      };
      window.__PIARIUM_SET_PWA_ORIENTATION__ = (value) => {
        const resolvedOrientation = setStoredOrientation(value);
        void updateManifest(null, resolvedOrientation);
        return resolvedOrientation;
      };
      window.__PIARIUM_UPDATE_PWA_MANIFEST__ = () => {
        refreshManifestFromStorage();
      };
    </script>

    <script>
      // Blocking script to detect and apply theme before first paint
      (function() {
        try {
          var themeMode = localStorage.getItem('themeMode');
          var variant = localStorage.getItem('selectedThemeVariant');
          var useSystem = localStorage.getItem('useSystemTheme');
          var isDark;

          // Check themeMode first (new storage key)
          if (themeMode === 'dark') {
            isDark = true;
          } else if (themeMode === 'light') {
            isDark = false;
          } else if (themeMode === 'system' || useSystem === null || useSystem === 'true') {
            // System preference
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else if (variant === 'light' || variant === 'dark') {
            // Legacy storage key fallback
            isDark = variant === 'dark';
          } else {
            // Default to system
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }

          // Apply theme class and data attribute
          document.documentElement.classList.add(isDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-splash-variant', isDark ? 'dark' : 'light');
          document.documentElement.style.setProperty('color-scheme', isDark ? 'dark' : 'light');

          // Splash colors persisted by the app theme system
          var splashBgLight = localStorage.getItem('splashBgLight');
          var splashFgLight = localStorage.getItem('splashFgLight');
          var splashBgDark = localStorage.getItem('splashBgDark');
          var splashFgDark = localStorage.getItem('splashFgDark');

          if (splashBgLight) document.documentElement.style.setProperty('--splash-background-light', splashBgLight);
          if (splashFgLight) document.documentElement.style.setProperty('--splash-stroke-light', splashFgLight);
          if (splashBgDark) document.documentElement.style.setProperty('--splash-background-dark', splashBgDark);
          if (splashFgDark) document.documentElement.style.setProperty('--splash-stroke-dark', splashFgDark);
        } catch (error) {
          console.warn('Failed to apply theme:', error);
        }
      })();
    </script>

    <!-- Theme color - Safari iOS 26+ prioritizes CSS background-color over this, but keep as fallback -->
    <meta name="theme-color" content="#151313" />
    <meta name="theme-color" content="#151313" media="(prefers-color-scheme: dark)" />

    <!-- iOS Safari PWA styling -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Piarium" />

    <title>Piarium - Pi Coding Workspace</title>
    <meta name="description" content="Pi-native coding workspace for desktop and web" />
    <meta name="application-name" content="Piarium" />
    <meta name="apple-mobile-web-app-title" content="Piarium" />

    <!-- Inline CSS for loading screen and Nerd Fonts (before Tailwind loads) -->
    <style>
      /* Nerd Font @font-face declarations for terminal icon support */
      @font-face {
        font-family: 'JetBrainsMono Nerd Font';
        src:
          local('JetBrainsMono Nerd Font'),
          url('https://cdn.jsdelivr.net/gh/mshaugh/nerdfont-webfonts@v3.3.0/build/fonts/JetBrainsMonoNerdFont-Regular.woff2') format('woff2'),
          url('https://cdn.jsdelivr.net/gh/mshaugh/nerdfont-webfonts@v3.3.0/build/fonts/JetBrainsMonoNerdFont-Regular.woff') format('woff');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
        unicode-range: U+E000-F8FF, U+F0000-FFFFF;
      }

      @font-face {
        font-family: 'FiraCode Nerd Font';
        src:
          local('FiraCode Nerd Font'),
          url('https://cdn.jsdelivr.net/gh/mshaugh/nerdfont-webfonts@v3.3.0/build/fonts/FiraCodeNerdFont-Regular.woff2') format('woff2'),
          url('https://cdn.jsdelivr.net/gh/mshaugh/nerdfont-webfonts@v3.3.0/build/fonts/FiraCodeNerdFont-Regular.woff') format('woff');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
        unicode-range: U+E000-F8FF, U+F0000-FFFFF;
      }

      :root {
        --splash-background-dark: #151313;
        --splash-stroke-dark: #CECDC3;
        --splash-background-light: #FFFCF0;
        --splash-stroke-light: #100F0F;

        --splash-background: var(--splash-background-dark);
        --splash-stroke: var(--splash-stroke-dark);

        /* Fallback fills (overridden below when supported) */
        --splash-face-fill: rgba(255, 255, 255, 0.15);
        --splash-cell-fill: rgba(255, 255, 255, 0.35);
        --splash-logo-fill: var(--splash-stroke);
        /* The floor, which is drawn behind the mark and must stay much fainter than the mark's own
           face cells or it competes with it. The pulse is opaque, not a wash: the floor's cells are the
           splash cover, so a translucent peak would open a hole in it every cycle. */
        --splash-lattice-line: rgba(255, 255, 255, 0.22);
        --splash-cell-pulse: #1d1b1b;
      }

      html[data-splash-variant='light'] {
        --splash-background: var(--splash-background-light);
        --splash-stroke: var(--splash-stroke-light);
        --splash-face-fill: rgba(0, 0, 0, 0.15);
        --splash-cell-fill: rgba(0, 0, 0, 0.4);
        --splash-logo-fill: var(--splash-stroke);
        --splash-lattice-line: rgba(0, 0, 0, 0.22);
        --splash-cell-pulse: #f2efe4;
      }

      html[data-splash-variant='dark'] {
        --splash-background: var(--splash-background-dark);
        --splash-stroke: var(--splash-stroke-dark);
        --splash-logo-fill: var(--splash-stroke);
      }

      @supports (color: color-mix(in srgb, white 50%, transparent)) {
        :root {
          --splash-face-fill: color-mix(in srgb, var(--splash-stroke) 15%, transparent);
          --splash-cell-fill: color-mix(in srgb, var(--splash-stroke) 35%, transparent);
          --splash-lattice-line: color-mix(in srgb, var(--splash-stroke) 22%, transparent);
          /* Mixed into the background rather than over transparency, so the cell stays opaque. */
          --splash-cell-pulse: color-mix(in srgb, var(--splash-stroke) 7%, var(--splash-background));
        }
      }

      /* The themed background before the splash element itself is parsed. One tag's worth of white is
         still a frame of white, and this is also what the reveal exposes at the very edges of the window
         while the app's own background is still arriving. */
      html { background: var(--splash-background); }

      /* Pre-paint splash.
         Everything here must be inline: it has to cover the viewport before the bundle exists, and a
         frame later is a frame of unpainted background. It is a verbatim copy of splashPlaneCss() in
         packages/ui/src/components/ui/piarium-splash-lattice.ts, which the geometry test asserts
         character for character, so edit that function rather than this block. The floor's grid and
         camera transform are in here rather than applied by script because nothing about them depends on
         the window: the floor is fixed and larger than any window it has to cover. */
      /* SPLASH-CSS-BEGIN */
.pi-splash {
position: fixed;
inset: 0;
z-index: 9998;
overflow: hidden;
}
.pi-splash[data-leaving='true'] { pointer-events: none; }

/* The cover is the floor's cells, not this element.
   That is the whole exit: each cell is opaque, so when one shrinks away the app shows through the gap it
   leaves, and the staggered delays turn that into a wave travelling out from the cube's feet. An opaque
   container would have made the same wave reveal nothing — the lines would vanish and the screen would
   stay a flat colour until the element was removed, which is a hard cut. */
/* A registered custom property, so it interpolates. Read with a zero fallback too: without @property the
   hole never opens and the backdrop resolves with its fade alone, which is the previous behaviour rather
   than a hole in the middle of the cover. */
@property --pi-splash-open {
syntax: '<length>';
inherits: false;
initial-value: 0px;
}
/* The floor is a quadrilateral in projection and a window is a rectangle, so the cells cannot cover the
   screen's corners. The backdrop covers everything they miss, and the hole opens from the cube's feet so
   that where the cells *are* the cover, they are the only cover. */
.pi-splash-backdrop {
position: absolute;
inset: 0;
background: var(--splash-background, var(--color-background, #151313));
-webkit-mask-image: radial-gradient(circle at 50% 56%, rgba(0,0,0,0) var(--pi-splash-open, 0px), rgba(0,0,0,1) calc(var(--pi-splash-open, 0px) + 64px));
mask-image: radial-gradient(circle at 50% 56%, rgba(0,0,0,0) var(--pi-splash-open, 0px), rgba(0,0,0,1) calc(var(--pi-splash-open, 0px) + 64px));
}
/* Boot only, which is also the default: the three hosts that paint before any module is evaluated set no
   mode, and boot is the only thing they cover. A profile switch sweeps its cells along one floor axis
   instead of radiating, so a hole opening from the middle would be travelling the wrong way; there the
   backdrop just fades and the sweep reads as a wipe over it. */
.pi-splash:not([data-mode='switch'])[data-leaving='true'] .pi-splash-backdrop {
animation:
pi-splash-open 480ms 240ms cubic-bezier(0.25, 0.6, 0.3, 1) both,
pi-splash-backdrop-out 260ms 720ms ease both;
}
.pi-splash[data-mode='switch'][data-leaving='true'] .pi-splash-backdrop {
animation: pi-splash-backdrop-out 740ms ease both;
}
@keyframes pi-splash-open {
to { --pi-splash-open: 451px; }
}
@keyframes pi-splash-backdrop-out {
to { opacity: 0; }
}

/* Two fades, on two untransformed wrappers, because they answer two different questions and a mask
   applies in its own element's coordinate space. Masking the floor itself meant a local circle came out
   a sheared ellipse once the camera had run, and the screen's corners were cut first: the floor visibly
   stopped short of them. Nesting instead multiplies the two alphas without needing mask-composite. */
.pi-splash-ground-clip {
position: absolute;
inset: 0;
overflow: hidden;
-webkit-mask-image: radial-gradient(circle at 50% 56%, rgba(0,0,0,1) 451px, rgba(0,0,0,0.55) 1353px, rgba(0,0,0,0.3) 2255px);
mask-image: radial-gradient(circle at 50% 56%, rgba(0,0,0,1) 451px, rgba(0,0,0,0.55) 1353px, rgba(0,0,0,0.3) 2255px);
}
/* The horizon. Receding floor points crowd toward a line 1125px above the
   origin and never reach it, so a floor drawn to any finite depth always ends somewhere, and on a tall
   window that end lands mid-screen where the peripheral fade cannot reach it. Anchoring the ramp to the
   origin's own percentage keeps it in place at every window size. */
.pi-splash-horizon {
position: absolute;
inset: 0;
overflow: hidden;
-webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) calc(56% - 541px), rgba(0,0,0,1) calc(56% - 452px));
mask-image: linear-gradient(to bottom, rgba(0,0,0,0) calc(56% - 541px), rgba(0,0,0,1) calc(56% - 452px));
}
/* Flat transform style on purpose: the cells are rasterised once and mapped by a single projective
   transform, rather than each becoming a participant in a 3D rendering context. */
.pi-splash-ground {
position: absolute;
left: 50%;
top: 56%;
display: grid;
transform-origin: 0 0;
grid-template-columns: repeat(24, 96px);
grid-template-rows: repeat(24, 96px);
transform: perspective(1800px) rotateX(58deg) rotateZ(45deg) translate(-1392px, -1392px);
}
/* Opaque, because these cells are the cover. Two edges each, so neighbours do not stack into a 2px rule. */
.pi-splash-cell {
background: var(--splash-background, var(--color-background, #151313));
box-shadow: inset -1px -1px 0 var(--splash-lattice-line, rgba(255, 255, 255, 0.22));
transform-origin: center;
}
/* Idle breathing starts late on purpose: a fast start never reaches it, so it only ever appears when
   there is genuinely something to wait for. Both ends are opaque colours: a translucent pulse would have
   punched a hole in the cover for half of every cycle. */
.pi-splash-cell[data-breathe='true'] {
animation: pi-splash-breathe 2.8s ease-in-out infinite;
animation-delay: calc(1.2s + var(--pi-breathe-delay));
}
@keyframes pi-splash-breathe {
0%, 100% { background: var(--splash-background, var(--color-background, #151313)); }
50% { background: var(--splash-cell-pulse, var(--splash-background, #151313)); }
}
/* Declared after the breathing rule so equal specificity lets the exit win without !important. */

    <!-- Nerd Fonts are terminal-only. Expose an idempotent first-use loader so
         a normal chat/settings startup does not download them. -->
    <script>
      (function() {
        let nerdFontsPromise = null;
        window.__PIARIUM_ENSURE_NERD_FONTS__ = function() {
          if (nerdFontsPromise) return nerdFontsPromise;
          const fonts = [
            {
              name: 'JetBrainsMono Nerd Font',
              url: 'https://cdn.jsdelivr.net/gh/mshaugh/nerdfont-webfonts@v3.3.0/build/fonts/JetBrainsMonoNerdFont-Regular.woff2'
            },
            {
              name: 'FiraCode Nerd Font',
              url: 'https://cdn.jsdelivr.net/gh/mshaugh/nerdfont-webfonts@v3.3.0/build/fonts/FiraCodeNerdFont-Regular.woff2'
            }
          ];

          const fontPromises = fonts.map(font => {
            const fontFace = new FontFace(font.name, `url(${font.url}) format('woff2')`);
            document.fonts.add(fontFace);
            return fontFace.load().catch(err => {
              console.warn(`Failed to load font: ${font.name}`, err);
            });
          });

          nerdFontsPromise = Promise.allSettled(fontPromises).then(() => {
            document.documentElement.classList.add('fonts-loaded');
          });
          return nerdFontsPromise;
        };
      })();
    </script>
