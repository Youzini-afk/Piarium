<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Piarium Mini Chat</title>

    <script>
      // Apply theme + splash colors before first paint so the window opens on a
      // branded splash instead of flashing white while React/CSS load.
      (function() {
        try {
          var themeMode = localStorage.getItem('themeMode');
          var variant = localStorage.getItem('selectedThemeVariant');
          var useSystem = localStorage.getItem('useSystemTheme');
          var isDark;

          if (themeMode === 'dark') {
            isDark = true;
          } else if (themeMode === 'light') {
            isDark = false;
          } else if (themeMode === 'system' || useSystem === null || useSystem === 'true') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else if (variant === 'light' || variant === 'dark') {
            isDark = variant === 'dark';
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }

          document.documentElement.classList.add(isDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-splash-variant', isDark ? 'dark' : 'light');
          document.documentElement.style.setProperty('color-scheme', isDark ? 'dark' : 'light');

          var splashBgLight = localStorage.getItem('splashBgLight');
          var splashFgLight = localStorage.getItem('splashFgLight');
          var splashBgDark = localStorage.getItem('splashBgDark');
          var splashFgDark = localStorage.getItem('splashFgDark');

          if (splashBgLight) document.documentElement.style.setProperty('--splash-background-light', splashBgLight);
          if (splashFgLight) document.documentElement.style.setProperty('--splash-stroke-light', splashFgLight);
          if (splashBgDark) document.documentElement.style.setProperty('--splash-background-dark', splashBgDark);
          if (splashFgDark) document.documentElement.style.setProperty('--splash-stroke-dark', splashFgDark);
        } catch (error) {
          console.warn('Failed to apply theme:', error);
        }
      })();
    </script>

    <style>
      /* Lattice-free plane, no cube. The mini-chat content renders its own (single) Piarium cube in
         its empty state, so a cube here would briefly show a second, differently-sized one before
         handing off. The plane carries the same identity without that collision.

         The rules below are a verbatim copy of splashPlaneCss() in
         packages/ui/src/components/ui/piarium-splash-lattice.ts, which the geometry test asserts
         character for character, so edit that function rather than this block. */
      :root {
        --splash-background-dark: #151313;
        --splash-stroke-dark: #CECDC3;
        --splash-background-light: #FFFCF0;
        --splash-stroke-light: #100F0F;
        --splash-background: var(--splash-background-dark);
        --splash-stroke: var(--splash-stroke-dark);
        --splash-lattice-line: rgba(255, 255, 255, 0.22);
        --splash-cell-fill: rgba(255, 255, 255, 0.35);
      }
      html[data-splash-variant='light'] {
        --splash-background: var(--splash-background-light);
        --splash-stroke: var(--splash-stroke-light);
        --splash-lattice-line: rgba(0, 0, 0, 0.22);
        --splash-cell-fill: rgba(0, 0, 0, 0.35);
      }
      html[data-splash-variant='dark'] {
        --splash-background: var(--splash-background-dark);
        --splash-stroke: var(--splash-stroke-dark);
      }
      @supports (color: color-mix(in srgb, white 50%, transparent)) {
        :root {
          --splash-lattice-line: color-mix(in srgb, var(--splash-stroke) 22%, transparent);
          --splash-cell-fill: color-mix(in srgb, var(--splash-stroke) 35%, transparent);
        }
      }
      /* The pre-paint cover paints the themed background before the plane exists. */
      #initial-loading { background-color: var(--splash-background); }
      /* SPLASH-CSS-BEGIN */
.pi-splash {
position: fixed;
inset: 0;
z-index: 9998;
overflow: hidden;
background: var(--splash-background, var(--color-background, #151313));
}
.pi-splash[data-leaving='true'] { pointer-events: none; }

/* Positioned at the mark's footprint, with its own origin pinned there. The grid template and the
   registering offset arrive inline, because both depend on the measured viewport. */
.pi-splash-ground {
position: absolute;
left: 50%;
top: 54%;
display: grid;
transform-origin: 0 0;
-webkit-mask-image: radial-gradient(120% 96% at 50% 50%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.9) 30%, rgba(0,0,0,0.4) 62%, rgba(0,0,0,0) 88%);
mask-image: radial-gradient(120% 96% at 50% 50%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.9) 30%, rgba(0,0,0,0.4) 62%, rgba(0,0,0,0) 88%);
}
/* Two edges per cell, so neighbours do not stack into a 2px rule. */
.pi-splash-cell {
box-shadow: inset -1px -1px 0 var(--splash-lattice-line, rgba(255, 255, 255, 0.22));
}
/* Idle breathing starts late on purpose: a fast start never reaches it, so it only ever appears
   when there is genuinely something to wait for. */
.pi-splash-cell[data-breathe='true'] {
animation: pi-splash-breathe 2.8s ease-in-out infinite;
animation-delay: calc(1.2s + var(--pi-breathe-delay));
}
@keyframes pi-splash-breathe {
0%, 100% { background: transparent; }
50% { background: var(--splash-cell-fill, rgba(255, 255, 255, 0.35)); }
}
/* Declared after the breathing rule so equal specificity lets the exit win without !important. */
.pi-splash[data-leaving='true'] .pi-splash-cell {
animation: pi-splash-cell-out 460ms cubic-bezier(0.32, 0, 0.24, 1) both;
animation-delay: var(--pi-cell-delay);
}
/* Each cell shrinks toward its own centre while it fades, so the floor comes apart into scattering
   tiles rather than simply dimming. */
@keyframes pi-splash-cell-out {
to { opacity: 0; transform: scale(0.62); }
}


/* Reduced motion drops the staged animation for one fade of the whole cover. It must still show the
   cover: hiding it would put the unpainted first frame back. */
@media (prefers-reduced-motion: reduce) {
.pi-splash-cell,
.pi-splash[data-leaving='true'] .pi-splash-cell {
animation: none;
}
.pi-splash { transition: opacity 260ms ease; }
.pi-splash[data-leaving='true'] { opacity: 0; }
}
/* SPLASH-CSS-END */
    </style>

    <script type="module" src="/src/mini-chat-main.tsx"></script>
  </head>
  <body class="h-full bg-background text-foreground">
    <div id="root" class="h-full">
      <!-- Plane backdrop until the mini-chat React app is ready (dismissed in
           ElectronMiniChatApp through packages/ui/src/lib/splash.ts). No cube here on
           purpose — the content renders the single Piarium cube itself. -->
      <div id="initial-loading" class="pi-splash" data-leaving="false" role="status" aria-label="Loading Piarium">
        <div id="initial-loading-ground" class="pi-splash-ground" aria-hidden="true"></div>
      </div>
    </div>

    <script>
      // Builds the ground lattice, and holds the safety net that keeps a failed handoff from leaving the
      // window covered. Mirrors resolveGroundShape/groundInlineStyle in
      // packages/ui/src/components/ui/piarium-splash-lattice.ts. There is no mark here, so nothing to
      // register against, but the cell size and axes are still the cube's so the two windows match.
      (function () {
        var COS30 = 0.866;
        var ground = document.getElementById('initial-loading-ground');

        if (ground) {
          var mark = innerWidth >= 768 ? 168 : 124;
          var cell = mark * 0.48;
          var originY = innerHeight * 0.54;
          var reachY = Math.max(originY, innerHeight - originY);
          var axis = Math.ceil(Math.max(innerWidth / 2 / (COS30 * cell), (2 * reachY) / cell));
          axis = Math.max(8, Math.min(24, axis));
          if (axis % 2 !== 0) axis += 1;
          var offset = (axis / 2) * cell;

          ground.style.gridTemplateColumns = 'repeat(' + axis + ',' + cell + 'px)';
          ground.style.gridTemplateRows = 'repeat(' + axis + ',' + cell + 'px)';
          ground.style.transform = 'matrix(0.866, 0.5, -0.866, 0.5, 0, 0) translate('
            + -offset + 'px,' + -offset + 'px)';

          var middle = (axis - 1) / 2;
          var maxRadius = Math.hypot(middle, middle) || 1;
          var buffer = '';
          for (var row = 0; row < axis; row++) {
            for (var col = 0; col < axis; col++) {
              var fraction = Math.hypot(col - middle, row - middle) / maxRadius;
              buffer += '<span class="pi-splash-cell" data-breathe="false" style="--pi-cell-delay:'
                + Math.round(fraction * 520) + 'ms"></span>';
            }
          }
          ground.innerHTML = buffer;
        }

        // Safety net: never let the splash hang if the app fails to dismiss it.
        setTimeout(function () {
          var loading = document.getElementById('initial-loading');
          if (!loading || loading.dataset.leaving === 'true') return;
          loading.dataset.leaving = 'true';
          setTimeout(function () { loading.remove(); }, 980);
        }, 8000);
      })();
    </script>
  </body>
</html>
