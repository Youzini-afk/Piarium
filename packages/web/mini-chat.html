<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Piarium Mini Chat</title>

    <script>
      // Apply theme + splash colors before first paint so the window opens on a
      // branded splash instead of flashing white while React/CSS load.
      (function() {
        try {
          var themeMode = localStorage.getItem('themeMode');
          var variant = localStorage.getItem('selectedThemeVariant');
          var useSystem = localStorage.getItem('useSystemTheme');
          var isDark;

          if (themeMode === 'dark') {
            isDark = true;
          } else if (themeMode === 'light') {
            isDark = false;
          } else if (themeMode === 'system' || useSystem === null || useSystem === 'true') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else if (variant === 'light' || variant === 'dark') {
            isDark = variant === 'dark';
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }

          document.documentElement.classList.add(isDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-splash-variant', isDark ? 'dark' : 'light');
          document.documentElement.style.setProperty('color-scheme', isDark ? 'dark' : 'light');

          var splashBgLight = localStorage.getItem('splashBgLight');
          var splashFgLight = localStorage.getItem('splashFgLight');
          var splashBgDark = localStorage.getItem('splashBgDark');
          var splashFgDark = localStorage.getItem('splashFgDark');

          if (splashBgLight) document.documentElement.style.setProperty('--splash-background-light', splashBgLight);
          if (splashFgLight) document.documentElement.style.setProperty('--splash-stroke-light', splashFgLight);
          if (splashBgDark) document.documentElement.style.setProperty('--splash-background-dark', splashBgDark);
          if (splashFgDark) document.documentElement.style.setProperty('--splash-stroke-dark', splashFgDark);
        } catch (error) {
          console.warn('Failed to apply theme:', error);
        }
      })();
    </script>

    <style>
      /* The isometric lattice, but no cube. The mini-chat content renders its own (single) Piarium
         cube in its empty state, so a cube here would briefly show a second, differently-sized one
         before handing off. The lattice carries the same identity without that collision, and it
         dissolves on the same schedule as the web shell's splash. Geometry is asserted against the
         React logo by packages/ui/src/components/ui/piarium-logo-geometry.test.ts. */
      :root {
        --splash-background-dark: #151313;
        --splash-stroke-dark: #CECDC3;
        --splash-background-light: #FFFCF0;
        --splash-stroke-light: #100F0F;
        --splash-background: var(--splash-background-dark);
        --splash-stroke: var(--splash-stroke-dark);
        --splash-lattice-line: rgba(255, 255, 255, 0.12);
      }
      html[data-splash-variant='light'] {
        --splash-background: var(--splash-background-light);
        --splash-stroke: var(--splash-stroke-light);
        --splash-lattice-line: rgba(0, 0, 0, 0.12);
      }
      html[data-splash-variant='dark'] {
        --splash-background: var(--splash-background-dark);
        --splash-stroke: var(--splash-stroke-dark);
      }
      @supports (color: color-mix(in srgb, white 50%, transparent)) {
        :root { --splash-lattice-line: color-mix(in srgb, var(--splash-stroke) 12%, transparent); }
      }

      #initial-loading {
        position: absolute;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background-color: var(--splash-background);
      }
      #initial-loading.pi-splash-out { pointer-events: none; }

      #initial-loading-lattice {
        position: absolute;
        left: 50%;
        top: 50%;
        display: grid;
        transform-origin: center;
        transform: translate(-50%, -50%) matrix(0.866, 0.5, -0.866, 0.5, 0, 0);
      }
      /* Two edges per cell, so neighbours do not stack into a 2px rule. */
      #initial-loading-lattice > i {
        box-shadow: inset -1px -1px 0 var(--splash-lattice-line);
      }
      #initial-loading.pi-splash-out #initial-loading-lattice > i {
        animation: pi-splash-cell-out 400ms cubic-bezier(0.4, 0, 0.3, 1) both;
        animation-delay: var(--d);
      }
      @keyframes pi-splash-cell-out {
        to { opacity: 0; transform: scale(0.82); }
      }

      /* Reduced motion drops the per-cell dissolve for one fade of the whole cover. It must still
         show the cover: hiding it would put the unpainted first frame back. */
      @media (prefers-reduced-motion: reduce) {
        #initial-loading.pi-splash-out #initial-loading-lattice > i { animation: none; }
        #initial-loading { transition: opacity 260ms ease; }
        #initial-loading.pi-splash-out { opacity: 0; }
      }
    </style>

    <script type="module" src="/src/mini-chat-main.tsx"></script>
  </head>
  <body class="h-full bg-background text-foreground">
    <div id="root" class="h-full">
      <!-- Lattice backdrop until the mini-chat React app is ready (dismissed in
           ElectronMiniChatApp through packages/ui/src/lib/splash.ts). No cube here on
           purpose — the content renders the single Piarium cube itself. -->
      <div id="initial-loading">
        <div id="initial-loading-lattice" aria-hidden="true"></div>
      </div>
    </div>

    <script>
      // Builds the lattice, and holds the safety net that keeps a failed handoff from leaving the
      // window covered. Mirrors resolveLatticeShape in PiariumSplash.tsx; the mini-chat window is
      // small, so this lands near the minimum axis count, which is the intended texture there.
      (function () {
        var COS30 = 0.866;
        var SIN30 = 0.5;
        var lattice = document.getElementById('initial-loading-lattice');

        if (lattice) {
          var cell = innerWidth >= 768 ? 86 : 62;
          var required = Math.max(innerWidth / COS30, innerHeight / SIN30);
          var axis = Math.max(4, Math.min(16, Math.round(((required / 2) * 1.5) / cell)));
          lattice.style.gridTemplateColumns = 'repeat(' + axis + ',' + cell + 'px)';
          lattice.style.gridTemplateRows = 'repeat(' + axis + ',' + cell + 'px)';

          var mid = (axis - 1) / 2;
          var maxRadius = Math.hypot(mid, mid) || 1;
          var buffer = '';
          for (var row = 0; row < axis; row++) {
            for (var col = 0; col < axis; col++) {
              var delay = Math.round((Math.hypot(col - mid, row - mid) / maxRadius) * 460);
              buffer += '<i style="--d:' + delay + 'ms"></i>';
            }
          }
          lattice.innerHTML = buffer;
        }

        // Safety net: never let the splash hang if the app fails to dismiss it.
        setTimeout(function () {
          var loading = document.getElementById('initial-loading');
          if (!loading || loading.classList.contains('pi-splash-out')) return;
          loading.classList.add('pi-splash-out');
          setTimeout(function () { loading.remove(); }, 900);
        }, 8000);
      })();
    </script>
  </body>
</html>
