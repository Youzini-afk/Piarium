      // branded splash instead of flashing white while React/CSS load.

            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }

          document.documentElement.classList.add(isDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-splash-variant', isDark ? 'dark' : 'light');
          document.documentElement.style.setProperty('color-scheme', isDark ? 'dark' : 'light');

          var splash = storedTheme && storedTheme.splash;
          var splashBgLight = splash && splash.light && splash.light.background;
          var splashFgLight = splash && splash.light && splash.light.foreground;
          var splashBgDark = splash && splash.dark && splash.dark.background;
          var splashFgDark = splash && splash.dark && splash.dark.foreground;

          if (splashBgLight) document.documentElement.style.setProperty('--splash-background-light', splashBgLight);
          if (splashFgLight) document.documentElement.style.setProperty('--splash-stroke-light', splashFgLight);
          if (splashBgDark) document.documentElement.style.setProperty('--splash-background-dark', splashBgDark);
          if (splashFgDark) document.documentElement.style.setProperty('--splash-stroke-dark', splashFgDark);
        } catch (error) {
          console.warn('Failed to apply theme:', error);
        }
      })();

         empty state, so a cube here would briefly show a second one before handing off. The floor alone
         carries the same identity without that collision.

         The rules below are a verbatim copy of splashPlaneCss() in
         packages/ui/src/components/ui/piarium-splash-lattice.ts, which the geometry test asserts
         character for character, so edit that function rather than this block. */

        --splash-background-dark: #151313;
        --splash-stroke-dark: #CECDC3;
        --splash-background-light: #FFFCF0;
        --splash-stroke-light: #100F0F;
        --splash-background: var(--splash-background-dark);
        --splash-stroke: var(--splash-stroke-dark);
        --splash-lattice-line: rgba(255, 255, 255, 0.22);
        /* Opaque, not a wash: the floor's cells are the cover, so a translucent peak would open a hole
           in it every cycle. */
        --splash-cell-pulse: #1d1b1b;
      }
      html[data-splash-variant='light'] {
        --splash-background: var(--splash-background-light);

        --splash-cell-pulse: #f2efe4;

      html[data-splash-variant='dark'] {

          --splash-cell-pulse: color-mix(in srgb, var(--splash-stroke) 7%, var(--splash-background));

      }
      /* The themed background before the splash element itself is parsed. The cover is the splash's own
         backdrop, not this, so that the floor's cells can be what reveals the window underneath. */
      html { background: var(--splash-background); }

/* The cover is the floor's cells, not this element.
   That is the whole exit: each cell is opaque, so when one shrinks away the app shows through the gap it
   leaves, and the staggered delays turn that into a wave travelling out from the cube's feet. An opaque

   stay a flat colour until the element was removed, which is a hard cut. */

--pi-splash-horizon-lift: 160vmax;

--pi-splash-horizon-lift: 160vmax;

--pi-splash-horizon-lift: 0px;

}
/* The floor is a quadrilateral in projection and a window is a rectangle, so the cells cannot cover the
   screen's corners. The backdrop covers everything they miss, and the hole opens from the cube's feet so
   that where the cells *are* the cover, they are the only cover. */

/* Boot only, which is also the default: the three hosts that paint before any module is evaluated set no
   mode, and boot is the only thing they cover. A profile switch sweeps its cells along one floor axis
   instead of radiating, so a hole opening from the middle would be travelling the wrong way; there the
   backdrop just fades and the sweep reads as a wipe over it. */

   applies in its own element's coordinate space. Masking the floor itself meant a local circle came out
   a sheared ellipse once the camera had run, and the screen's corners were cut first: the floor visibly
   stopped short of them. Nesting instead multiplies the two alphas without needing mask-composite. */

top: 0;

height: 2304px;

}
